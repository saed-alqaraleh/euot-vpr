name: Verify archived results
on:
  push:
  pull_request:
jobs:
  cpu-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-cpu.txt
      - name: Check hashes and archived matrices
        run: python scripts/verify_release.py
      - name: Reproduce manuscript contrasts
        run: python scripts/reproduce_headline.py --output outputs/headline_msls.json
